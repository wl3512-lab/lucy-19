<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lucy's 19th</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dbeafc; --card:#ffffff; --ink:#16283d; --muted:#6b8299;
    --line:#c3d8ea; --btn:#2f6db3; --btn2:#3b82d9;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;line-height:1.5;min-height:100dvh;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 16px calc(64px + env(safe-area-inset-bottom))}

  header{margin:4px 0 24px}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;
    letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
  h1{font-weight:800;font-size:clamp(38px,11vw,60px);letter-spacing:-.03em;margin:0;line-height:1}
  .sub{color:var(--muted);margin:12px 0 0;font-size:15px}

  #tape{margin:20px 0 0;max-width:560px;display:none}
  #tape iframe{border-radius:12px;display:block;width:100%}

  .panel{border:1px solid var(--line);border-radius:16px;background:var(--card);
    padding:16px;margin:24px 0 30px;max-width:560px}
  .panel h2{font-weight:700;font-size:17px;margin:0 0 4px}
  .panel .note{color:var(--muted);font-size:13px;margin:0 0 16px}
  .field{margin-bottom:13px}
  label{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;
    letter-spacing:.04em;color:var(--muted);margin:0 0 6px;text-transform:lowercase}
  input[type=text]{width:100%;padding:13px;border-radius:11px;
    border:1px solid var(--line);background:#f2f8fd;color:var(--ink);
    font-family:inherit;font-size:16px}
  input[type=text]::placeholder{color:#9db6cc}
  input[type=text]:focus{outline:none;border-color:var(--ink)}

  .file-btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    padding:13px 15px;border-radius:11px;border:1px dashed var(--line);
    background:#f2f8fd;font-size:14px;color:var(--muted);min-height:46px}
  .file-btn:hover,.file-btn:active{border-color:var(--btn);color:var(--btn)}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
  .prev{margin-top:10px;display:none;position:relative;width:100%;max-width:180px}
  .prev img,.prev video{width:100%;border-radius:10px;display:block;max-height:220px;object-fit:cover;background:#000}
  .prev button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;
    border:none;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer;font-size:15px}

  .post{margin-top:6px;width:100%;padding:15px;border:none;border-radius:12px;
    background:var(--btn);color:#fff;font-weight:700;font-size:16px;cursor:pointer;min-height:50px}
  .post:active{transform:scale(.99)}
  .post:disabled{opacity:.5;cursor:default}
  .err{color:#c2453f;font-size:13.5px;margin-top:10px;min-height:1px}

  .toggle{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    max-width:560px;cursor:pointer;padding:16px 20px;border-radius:16px;border:none;
    background:linear-gradient(135deg,var(--btn2),var(--btn));color:#fff;
    font-family:inherit;font-weight:700;font-size:16px;
    box-shadow:0 10px 24px -10px rgba(47,109,179,.65);
    transition:transform .12s ease,box-shadow .12s ease;margin:2px 0 22px}
  .toggle:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(47,109,179,.7)}
  .toggle:active{transform:translateY(0) scale(.99)}
  .toggle .caret{transition:transform .2s ease;font-size:13px;opacity:.9}
  .toggle.open .caret{transform:rotate(180deg)}
  .toggle .badge{background:rgba(255,255,255,.25);color:#fff;
    font-family:"JetBrains Mono",monospace;font-size:13px;padding:3px 11px;border-radius:999px;line-height:1.6}

  .meta{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);margin:0 0 16px}
  .status{color:var(--muted);font-size:14px;padding:20px 0}

  #wallwrap{display:none}
  #wallwrap.open{display:block;animation:reveal .3s ease}
  @keyframes reveal{from{opacity:0;transform:translateY(6px)}}

  .wall{column-count:1;column-gap:16px}
  @media(min-width:600px){.wall{column-count:2}}
  @media(min-width:900px){.wall{column-count:3}}
  .card{break-inside:avoid;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin:0 0 16px}
  .card .name{font-weight:600;font-size:15px;margin:0 0 8px}
  .card .photo,.card .clip{width:100%;border-radius:10px;display:block;margin:0 0 10px}
  .card .clip{background:#000}
  .card .memory{font-size:15px;margin:0 0 12px}
  .card iframe{display:block;width:100%;border-radius:10px}
  .spotify{height:152px}
  .vwrap{position:relative;width:100%;padding-top:56.25%;margin:0 0 10px;border-radius:10px;overflow:hidden;background:#000}
  .vwrap iframe{position:absolute;inset:0;width:100%;height:100%}
  .vlink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    background:var(--bg);color:var(--btn);font-weight:600;font-size:14px;
    padding:9px 13px;border-radius:10px;margin:0 0 10px}
  /* skeletons reserve space so lazy embeds don't jump the layout */
  .lazy{margin:0 0 10px;border-radius:10px;
    background:linear-gradient(100deg,#eaf1fa 30%,#f4f9fe 50%,#eaf1fa 70%);
    background-size:200% 100%;animation:sh 1.3s linear infinite}
  .lazy.sk-song{height:152px}
  .lazy.sk-vid{width:100%;padding-top:56.25%}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  @media(prefers-reduced-motion:reduce){.lazy{animation:none}}

  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <p class="kicker">memory wall</p>
    <h1>lucy's 19th</h1>
    <p class="sub">leave a memory, a song, and a photo or clip.</p>
  </header>

  <div id="tape"><div id="tape-embed"></div></div>

  <section class="panel">
    <h2>add one</h2>
    <p class="note">name + one line required. everything else optional.</p>
    <div class="field"><label for="name">name</label>
      <input type="text" id="name" maxlength="24" placeholder="you"></div>
    <div class="field"><label for="memory">memory</label>
      <input type="text" id="memory" maxlength="140" placeholder="one line"></div>
    <div class="field"><label for="song">song — spotify link</label>
      <input type="text" id="song" placeholder="optional"></div>
    <div class="field">
      <label>photo / video</label>
      <label class="file-btn" for="media">＋ add photo or video</label>
      <input type="file" id="media" accept="image/*,video/*">
      <div class="prev" id="prev"></div>
    </div>
    <button class="post" id="post">post</button>
    <div class="err" id="err"></div>
  </section>

  <button class="toggle" id="toggle">
    <span id="toglabel">view everyone's posts</span>
    <span class="badge" id="badge">…</span>
    <span class="caret">▾</span>
  </button>

  <div id="wallwrap">
    <p class="meta" id="count"></p>
    <div class="status" id="status">loading…</div>
    <div class="wall" id="wall"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://svfztofongdtyguaovoz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GCzeiKG-XFAFGsvQP7cZ8A_N_5JWATN";
const PLAYLIST_URL = "";
const STORAGE_BUCKET = "media";
const MAX_VIDEO_MB = 50;

const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseSpotify(raw){
  if(!raw) return null; raw = raw.trim();
  let m = raw.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|playlist|album|episode)\/([A-Za-z0-9]+)/);
  if(m) return {type:m[1], id:m[2]};
  m = raw.match(/spotify:(track|playlist|album|episode):([A-Za-z0-9]+)/);
  if(m) return {type:m[1], id:m[2]};
  return null;
}
const spotifySrc = (t,i) => `https://open.spotify.com/embed/${t}/${i}?utm_source=generator`;
function parseVideo(raw){
  if(!raw) return null; raw = raw.trim();
  if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(raw) || raw.includes("/storage/v1/object/public/"))
    return {kind:"file", src:raw};
  return {kind:"link", src:raw};
}

const configured = SUPABASE_URL && SUPABASE_ANON_KEY;
let db = null, mem = [];
if(configured){ db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

async function uploadFile(prefix, blob, contentType, ext){
  const path = `${prefix}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
  const { error } = await db.storage.from(STORAGE_BUCKET).upload(path, blob, {contentType, upsert:false});
  if(error) throw error;
  return db.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

async function saveMemory(rec){
  if(!db){ mem.unshift({...rec, created_at:new Date().toISOString()}); return; }
  let { error } = await db.from("memories").insert(rec);
  // if the video column doesn't exist yet, retry without it so posting still works
  if(error && /video/i.test(error.message||"")){
    const { video, ...rest } = rec;
    ({ error } = await db.from("memories").insert(rest));
  }
  if(error) throw error;
}
async function loadMemories(){
  if(db){
    const { data, error } = await db.from("memories").select("*").order("created_at",{ascending:false});
    if(error){ console.warn(error); return []; }
    return data || [];
  }
  return mem.slice();
}

/* compress a chosen photo -> {dataUrl for preview, blob for upload} */
function processPhoto(file){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 900; let {width:w,height:h} = img;
      if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL("image/jpeg",0.72);
      c.toBlob(b=> res({dataUrl, blob:b}), "image/jpeg", 0.72);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

let photoPrepared = null, videoFile = null;
$("media").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  $("err").textContent = ""; photoPrepared = null; videoFile = null;
  const prev = $("prev"); prev.innerHTML = ""; prev.style.display="none";
  if(f.type.startsWith("image/")){
    try{ photoPrepared = await processPhoto(f);
      prev.innerHTML = `<img src="${photoPrepared.dataUrl}" alt=""><button type="button" id="prevx" aria-label="remove">×</button>`;
      prev.style.display="block";
    }catch(_){ $("err").textContent = "couldn't read that image"; }
  } else if(f.type.startsWith("video/")){
    if(f.size > MAX_VIDEO_MB*1024*1024){
      $("err").textContent = `that clip is over ${MAX_VIDEO_MB}mb — trim it a bit`;
      $("media").value=""; return;
    }
    videoFile = f;
    const url = URL.createObjectURL(f);
    prev.innerHTML = `<video src="${url}" muted playsinline preload="metadata"></video><button type="button" id="prevx" aria-label="remove">×</button>`;
    prev.style.display="block";
  }
  const x = $("prevx"); if(x) x.addEventListener("click", clearMedia);
});
function clearMedia(){
  photoPrepared=null; videoFile=null; $("media").value="";
  $("prev").innerHTML=""; $("prev").style.display="none";
}

/* ---- render with lazy embeds ---- */
function mediaHTML(m){
  let out = "";
  if(m.photo) out += `<img class="photo" loading="lazy" decoding="async" src="${esc(m.photo)}" alt="">`;
  const v = m.video ? parseVideo(m.video) : null;
  if(v){
    if(v.kind==="file")
      out += `<div class="lazy sk-vid" data-kind="file" data-src="${esc(v.src)}"></div>`;
    else
      out += `<a class="vlink" href="${esc(v.src)}" target="_blank" rel="noopener">▶ watch clip</a>`;
  }
  const sp = m.spotify ? parseSpotify(m.spotify) : null;
  if(sp) out += `<div class="lazy sk-song" data-kind="spotify" data-src="${esc(spotifySrc(sp.type,sp.id))}"></div>`;
  return out;
}
function cardHTML(m){
  return `<article class="card"><div class="name">${esc(m.name||"someone")}</div>
    <p class="memory">${esc(m.memory||"")}</p>${mediaHTML(m)}</article>`;
}

let io = null;
function hydrate(el){
  const kind = el.dataset.kind, src = el.dataset.src;
  if(kind==="spotify")
    el.outerHTML = `<iframe class="spotify" src="${src}" height="152" frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
  else if(kind==="file")
    el.outerHTML = `<video class="clip" src="${src}" controls playsinline preload="none"></video>`;
}
function observeLazies(){
  if(io) io.disconnect();
  io = new IntersectionObserver((entries)=>{
    for(const en of entries){
      if(en.isIntersecting){ io.unobserve(en.target); hydrate(en.target); }
    }
  }, {rootMargin:"400px 0px"});
  document.querySelectorAll(".wall .lazy").forEach(el=> io.observe(el));
}

async function renderWall(){
  const list = await loadMemories();
  $("status").style.display = list.length ? "none" : "block";
  if(!list.length) $("status").textContent = configured ? "nothing here yet" : "preview mode";
  $("wall").innerHTML = list.map(cardHTML).join("");
  $("count").textContent = list.length ? list.length + (list.length===1?" post":" posts") : "";
  $("badge").textContent = list.length;
  observeLazies();
}

let wallOpen = false;
function setWall(open){
  wallOpen = open;
  $("wallwrap").classList.toggle("open", open);
  $("toggle").classList.toggle("open", open);
  $("toglabel").textContent = open ? "hide posts" : "view everyone's posts";
  if(open) observeLazies();
}
$("toggle").addEventListener("click", ()=> setWall(!wallOpen));

$("post").addEventListener("click", async ()=>{
  const name=$("name").value.trim(), memory=$("memory").value.trim(), song=$("song").value.trim();
  const err=$("err"); err.textContent="";
  if(!name){ err.textContent="add your name"; return; }
  if(!memory){ err.textContent="write one line"; return; }
  if(song && !parseSpotify(song)){ err.textContent="that spotify link looks off"; return; }

  const btn=$("post"); btn.disabled=true;
  try{
    let photo=null, video=null;
    if(photoPrepared){
      btn.textContent="uploading…";
      try{ photo = await uploadFile("photos", photoPrepared.blob, "image/jpeg", "jpg"); }
      catch(_){ photo = photoPrepared.dataUrl; } // fallback: inline if bucket missing
    }
    if(videoFile){
      btn.textContent="uploading video…";
      const ext=(videoFile.name.split(".").pop()||"mp4").toLowerCase();
      video = await uploadFile("clips", videoFile, videoFile.type||"video/mp4", ext);
    }
    if(!photoPrepared && !videoFile) btn.textContent="posting…";

    const rec = { name, memory };
    if(song)  rec.spotify = song;
    if(photo) rec.photo   = photo;
    if(video) rec.video   = video;   // only sent when there's actually a video
    await saveMemory(rec);
    $("name").value=""; $("memory").value=""; $("song").value=""; clearMedia();
    await renderWall(); setWall(true);
  }catch(e){
    console.warn(e);
    err.textContent = videoFile
      ? "video upload failed — make sure the storage bucket exists"
      : "couldn't save, try again";
  }
  btn.disabled=false; btn.textContent="post";
});

(function(){
  const sp = parseSpotify(PLAYLIST_URL); if(!sp) return;
  $("tape").style.display="block";
  $("tape-embed").innerHTML = `<iframe src="${spotifySrc(sp.type,sp.id)}" height="352"
    frameborder="0" loading="lazy"
    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
})();

renderWall();
</script>
