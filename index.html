<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lucy's 19th</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dbeafc;
    --card:#ffffff;
    --ink:#16283d;
    --muted:#6b8299;
    --line:#c3d8ea;
    --btn:#2f6db3;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;line-height:1.5;
    min-height:100dvh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:44px 20px 80px}

  header{margin:6px 0 30px}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;
    letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
  h1{font-weight:800;font-size:clamp(34px,7vw,60px);letter-spacing:-.03em;margin:0;line-height:1}
  .sub{color:var(--muted);margin:12px 0 0;font-size:15px}

  #tape{margin:22px 0 0;max-width:560px;display:none}
  #tape iframe{border-radius:12px;display:block;width:100%}

  .panel{border:1px solid var(--line);border-radius:14px;background:var(--card);
    padding:18px;margin:28px 0 36px;max-width:560px}
  .panel h2{font-weight:700;font-size:16px;margin:0 0 16px}
  .field{margin-bottom:12px}
  label{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;
    letter-spacing:.04em;color:var(--muted);margin:0 0 6px;text-transform:lowercase}
  input[type=text]{width:100%;padding:10px 12px;border-radius:9px;
    border:1px solid var(--line);background:#f2f8fd;color:var(--ink);
    font-family:inherit;font-size:15px}
  input[type=text]::placeholder{color:#9db6cc}
  input[type=text]:focus{outline:none;border-color:var(--ink)}

  .file-btn{display:inline-block;cursor:pointer;padding:9px 13px;border-radius:9px;
    border:1px solid var(--line);background:#f2f8fd;font-size:13px;color:var(--muted)}
  .file-btn:hover{border-color:var(--ink);color:var(--ink)}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
  .thumb{margin-top:10px;display:none;position:relative;width:80px}
  .thumb img{width:80px;height:80px;object-fit:cover;border-radius:8px}
  .thumb button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;
    border:none;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer;font-size:13px}

  .post{margin-top:4px;width:100%;padding:12px;border:none;border-radius:9px;
    background:var(--btn);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  .post:hover{opacity:.9}
  .post:disabled{opacity:.5;cursor:default}
  .err{color:#c2453f;font-size:13px;margin-top:8px;min-height:1px}

  .meta{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);margin:0 0 16px}
  .status{color:var(--muted);font-size:14px;padding:24px 0}

  .wall{column-count:3;column-gap:16px}
  @media(max-width:820px){.wall{column-count:2}}
  @media(max-width:520px){.wall{column-count:1}}
  .card{break-inside:avoid;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:14px;margin:0 0 16px}
  .card .name{font-weight:600;font-size:15px;margin:0 0 8px}
  .card .photo{width:100%;border-radius:8px;display:block;margin:0 0 10px}
  .card .memory{font-size:15px;margin:0 0 12px}
  .card iframe{border-radius:10px;display:block;width:100%}

  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <p class="kicker">memory wall</p>
    <h1>lucy's 19th</h1>
    <p class="sub">leave a memory and a song.</p>
  </header>

  <div id="tape"><div id="tape-embed"></div></div>

  <section class="panel">
    <h2>add one</h2>
    <div class="field"><label for="name">name</label>
      <input type="text" id="name" maxlength="24" placeholder="you"></div>
    <div class="field"><label for="memory">memory</label>
      <input type="text" id="memory" maxlength="140" placeholder="one line"></div>
    <div class="field"><label for="song">song</label>
      <input type="text" id="song" placeholder="spotify link"></div>
    <div class="field">
      <label>photo — optional</label>
      <label class="file-btn" for="photo">add photo</label>
      <input type="file" id="photo" accept="image/*">
      <div class="thumb" id="thumb"><img id="thumb-img" alt=""><button type="button" id="thumb-x" aria-label="remove">×</button></div>
    </div>
    <button class="post" id="post">post</button>
    <div class="err" id="err"></div>
  </section>

  <p class="meta" id="count"></p>
  <div class="status" id="status">loading…</div>
  <div class="wall" id="wall"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   FILL THESE IN  (from supabase › project settings › API)
   ========================================================= */
const SUPABASE_URL = "https://svfztofongdtyguaovoz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GCzeiKG-XFAFGsvQP7cZ8A_N_5JWATN";

/* optional: paste a collaborative playlist link for a player up top */
const PLAYLIST_URL = "";
/* ========================================================= */

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseSpotify(raw){
  if(!raw) return null; raw = raw.trim();
  let m = raw.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|playlist|album|episode)\/([A-Za-z0-9]+)/);
  if(m) return {type:m[1], id:m[2]};
  m = raw.match(/spotify:(track|playlist|album|episode):([A-Za-z0-9]+)/);
  if(m) return {type:m[1], id:m[2]};
  return null;
}
const embedSrc = (t,i) => `https://open.spotify.com/embed/${t}/${i}?utm_source=generator`;

/* --- storage: supabase if configured, else in-memory (preview only) --- */
const configured = SUPABASE_URL && SUPABASE_ANON_KEY;
let db = null, mem = [];
if(configured){ db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

async function saveMemory(rec){
  if(db){
    const { error } = await db.from("memories").insert(rec);
    if(error) throw error;
  } else { mem.unshift({...rec, created_at:new Date().toISOString()}); }
}
async function loadMemories(){
  if(db){
    const { data, error } = await db.from("memories")
      .select("*").order("created_at",{ascending:false});
    if(error){ console.warn(error); return []; }
    return data || [];
  }
  return mem.slice();
}

function processPhoto(file){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 720; let {width:w,height:h} = img;
      if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

let photoData = null;
$("photo").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{ photoData = await processPhoto(f);
    $("thumb-img").src = photoData; $("thumb").style.display="block";
  }catch(_){ $("err").textContent = "couldn't read that image"; }
});
$("thumb-x").addEventListener("click", ()=>{
  photoData=null; $("photo").value=""; $("thumb").style.display="none";
});

function cardHTML(m){
  const sp = parseSpotify(m.spotify);
  const photo = m.photo ? `<img class="photo" src="${m.photo}" alt="">` : "";
  const song = sp ? `<iframe src="${embedSrc(sp.type,sp.id)}" height="152"
      frameborder="0" loading="lazy"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>` : "";
  return `<article class="card"><div class="name">${esc(m.name||"someone")}</div>
    ${photo}<p class="memory">${esc(m.memory||"")}</p>${song}</article>`;
}

async function renderWall(){
  const list = await loadMemories();
  $("status").style.display = list.length ? "none" : "block";
  if(!list.length) $("status").textContent = configured ? "nothing here yet" : "preview mode — posts save once supabase is connected";
  $("wall").innerHTML = list.map(cardHTML).join("");
  $("count").textContent = list.length ? list.length + (list.length===1?" post":" posts") : "";
}

$("post").addEventListener("click", async ()=>{
  const name=$("name").value.trim(), memory=$("memory").value.trim(), song=$("song").value.trim();
  const err=$("err"); err.textContent="";
  if(!name){ err.textContent="add your name"; return; }
  if(!memory){ err.textContent="write one line"; return; }
  if(!song || !parseSpotify(song)){ err.textContent="paste a spotify link"; return; }
  const btn=$("post"); btn.disabled=true; btn.textContent="posting…";
  try{
    await saveMemory({name, memory, spotify:song, photo:photoData});
    $("name").value=""; $("memory").value=""; $("song").value="";
    photoData=null; $("photo").value=""; $("thumb").style.display="none";
    await renderWall();
  }catch(e){ err.textContent="couldn't save, try again"; console.warn(e); }
  btn.disabled=false; btn.textContent="post";
});

(function(){
  const sp = parseSpotify(PLAYLIST_URL); if(!sp) return;
  $("tape").style.display="block";
  $("tape-embed").innerHTML = `<iframe src="${embedSrc(sp.type,sp.id)}" height="352"
    frameborder="0" loading="lazy"
    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
})();

renderWall();
</script>
